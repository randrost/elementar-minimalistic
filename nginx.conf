# The image's default log_format 'main' writes $remote_addr and
# $http_x_forwarded_for; since the ingress speaks PROXY protocol the latter is
# the real visitor IP. 'noip' keeps time, request, status, size, referer, UA.
# conf.d is included in the http context, so log_format may live here;
# access_log must be set per server block or the inherited 'main' applies.
log_format noip '[$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log noip;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Security headers live in a snippet (see nginx-security-headers.conf):
    # every location below that adds a header must include it again.
    include /etc/nginx/snippets/security-headers.conf;

    # Angular routes are client-side, so any unknown path must return index.html.
    # Without this a refresh on /dashboard/basic would 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The entry point must not be cached, or a deploy never reaches anyone.
    # try_files above ends here too, so this covers every client-side route.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Favicons keep their name across deploys (not hashed): short cache only.
    location ~* ^/(?:favicon\.(?:ico|svg|png)|apple-touch-icon(?:-precomposed)?\.png)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
    }

    # Hashed build output never changes under the same name.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
