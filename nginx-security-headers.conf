# Security headers, included in every location that sets its own headers.
# nginx drops inherited add_header lines in any block that declares one, so
# a server-level add_header alone never reaches index.html or static files.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# WebGPU (AI Studio) needs cross-origin isolation for its threaded runtime.
add_header Cross-Origin-Opener-Policy same-origin always;
add_header Cross-Origin-Embedder-Policy require-corp always;
